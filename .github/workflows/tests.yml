name: Training pipeline tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-repro.txt
          python -m pip install --no-deps -e .
      - name: Fetch checksum-pinned reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m pose_training.fetch_base
      - name: Test geometry, data splits, recovery, training resume and ONNX export
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m pytest
