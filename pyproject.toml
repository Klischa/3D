[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-pose-training"
version = "0.1.0"
description = "Reproducible, synthetic-only pose-regressor retraining and evaluation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.5,<3",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["pose_training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
